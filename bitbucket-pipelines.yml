definitions:
  steps:
    - step: &build-test
        image: mcr.microsoft.com/dotnet/sdk:10.0
        caches:
          - dotnetcore
        script:
          - dotnet restore src/Dibk.Ftpb.Api.Email.sln
          - dotnet build-server shutdown
          - dotnet build src/Dibk.Ftpb.Api.Email.Web/Dibk.Ftpb.Api.Email.Web.csproj -c Release -f net10.0 --no-restore

    - step: &securityScan
        name: Security Scan
        script:
          - pipe: atlassian/git-secrets-scan:3.2.0

    # Builds the container image and pushes it to the shared ACR.
    # Requires the following Bitbucket repository variables:
    #   ACR_LOGIN_SERVER  e.g. myregistry.azurecr.io
    #   ACR_USERNAME      ACR token / service-principal id with push rights
    #   ACR_PASSWORD      (secured) the token/secret
    #   IMAGE_NAME        e.g. ftpb-email-api
    - step: &docker-build-push
        name: Build and push image to ACR
        services:
          - docker
        script:
          - export IMAGE_TAG=2.0.$BITBUCKET_BUILD_NUMBER
          - echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" --username "$ACR_USERNAME" --password-stdin
          - docker build -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" .
          - docker push "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

pipelines:
  # Runs for every branch push that doesn't match a pattern under `branches` below
  # (e.g. feature/*, bugfix/*, any branch) — a build-only gate.
  default:
    - parallel:
        - step: *build-test
        - step: *securityScan

  branches:
    master:
      - parallel:
          - step: *build-test
          - step: *securityScan
      - step: *docker-build-push
      - step:
          name: Deploy to Octopus
          image: octopusdeploy/octo:6.17.3-alpine
          script:
            # Image tag matches the Octopus release version; Octopus passes it to workload.bicep as imageTag.
            - export VERSION=2.0.$BITBUCKET_BUILD_NUMBER
            - octo pack --basePath=infrastructure --id $BITBUCKET_REPO_SLUG-infrastructure --version $VERSION --outFolder ./infra --format zip
            - octo push --package ./infra/$BITBUCKET_REPO_SLUG-infrastructure.$VERSION.zip  --server $OCTOPUS_SERVER --apiKey $OCTOPUS_APIKEY
