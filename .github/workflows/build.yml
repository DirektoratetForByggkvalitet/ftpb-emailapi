name: Build and Push Container Images
run-name: Build and push - ${{ github.ref_name }}

# Gitflow: develop -> dev, release/* and hotfix/* -> test, main -> prod.
# feature/* branches and pull requests are built, but no image is pushed.

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: |
          dotnet restore src/Dibk.Ftpb.Api.Email.sln
          dotnet build src/Dibk.Ftpb.Api.Email.sln -c Release --no-restore

  setup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      registry: ${{ steps.target.outputs.registry }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Set environment, registry and version
        id: target
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          case "$BRANCH" in
            main)                env=prod; version="2.0.$RUN_NUMBER" ;;
            release/*|hotfix/*)  env=test; version="2.0.$RUN_NUMBER-rc" ;;
            develop)             env=dev;  version="2.0.$RUN_NUMBER-beta" ;;
            *)                   exit 0 ;;
          esac
          echo "environment=$env" >> $GITHUB_OUTPUT
          echo "registry=cremailapi$env" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT

  build-email-api:
    needs: [build, setup]
    if: needs.setup.outputs.environment != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ needs.setup.outputs.registry }}

      # Image tag = release version, never 'latest' (see docs/FT-1999-status-drift.md).
      - name: Build and push email api
        run: |
          IMAGE=${{ needs.setup.outputs.registry }}.azurecr.io/ftpb-email-api:${{ needs.setup.outputs.version }}
          docker build -f Dockerfile -t $IMAGE .
          docker push $IMAGE
          echo "Pushed \`$IMAGE\`" >> $GITHUB_STEP_SUMMARY
