name: Deploy Container App
run-name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}

# dev and test are deployed by the build workflow (workflow_call) after a successful push.
# prod is deployed manually from main, with the version built on main (2.0.N).
# The app is deployed with the version tag. 'latest' is moved to the same image as a
# fallback for infrastructure jobs, and only the 5 newest version tags are kept.

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      version:
        description: Image tag to deploy, e.g. 2.0.42
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: DirektoratetForByggkvalitet/felles-workflows/.github/workflows/deploy-container-app.yml@v1
    with:
      environment: ${{ inputs.environment }}
      image: ftpb-email-api
      version: ${{ inputs.version }}
      registry: cremailapi${{ inputs.environment }}
      resource-group: rg-emailapi-${{ inputs.environment }}
      container-app: ca-emailapi-api-${{ inputs.environment }}
    secrets: inherit
